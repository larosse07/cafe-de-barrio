services:
  mysql:
    image: mysql:8.0
    container_name: cafe-de-barrio-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cafe_de_barrio}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-CafeBarrioRoot2026!}
      TZ: America/Lima
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-CafeBarrioRoot2026!}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - cafe-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafe-de-barrio-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      SERVER_PORT: ${SERVER_PORT:-8080}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-cafe_de_barrio}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:-CafeBarrioRoot2026!}
      JWT_SECRET: ${JWT_SECRET:?Configura JWT_SECRET antes de levantar Docker}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600000}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-604800000}
      ADMIN_NAME: ${ADMIN_NAME:-Administrador}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@cafedebarrio.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Configura ADMIN_PASSWORD antes de levantar Docker}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:4200,http://localhost}
      SEED_DATA_ENABLED: "false"
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 40s
    networks:
      - cafe-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafe-de-barrio-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8080/api}
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    networks:
      - cafe-network

volumes:
  mysql_data:
    driver: local

networks:
  cafe-network:
    driver: bridge
